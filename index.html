<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GolfMate — คำนวณพ้อยพนันกอล์ฟ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fairway:#1B3A2B;
    --fairway-light:#2E5940;
    --turf:#6FA96B;
    --sand:#EDE7D9;
    --sand-deep:#E1D8C2;
    --flag:#C1442D;
    --gold:#C9A227;
    --ink:#1B1B1B;
    --paper:#FBF8F1;
    --line:#D8CFB8;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--sand);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  h1,h2,h3,.disp{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em; margin:0;}
  .mono{font-family:'Space Mono',monospace;}
  .app{max-width:520px; margin:0 auto; padding:0 14px;}

  /* Header */
  header.top{
    background:var(--fairway);
    color:var(--paper);
    padding:16px 14px 20px;
    border-radius:0 0 20px 20px;
    position:sticky; top:0; z-index:20;
  }
  header.top .row{display:flex; align-items:center; justify-content:space-between;}
  .logo{font-size:22px; font-weight:700; color:var(--paper); display:flex; align-items:center; gap:8px;}
  .logo .flag{color:var(--flag); font-size:20px;}
  .subtitle{font-size:12px; color:var(--turf); font-family:'Work Sans',sans-serif; text-transform:none; letter-spacing:0; margin-top:2px;}
  .pill-nav{display:flex; gap:6px; font-size:11px;}
  .pill-nav button{
    background:rgba(255,255,255,0.08); color:var(--paper); border:1px solid rgba(255,255,255,0.2);
    border-radius:20px; padding:6px 10px; font-family:'Work Sans',sans-serif; font-weight:600;
  }
  .pill-nav button.active{background:var(--turf); color:var(--fairway); border-color:var(--turf);}

  main{padding-top:18px;}
  .screen{display:none;}
  .screen.active{display:block; animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .card h2{font-size:15px; color:var(--fairway); margin-bottom:10px; display:flex; align-items:center; gap:8px;}
  .card h2 .num{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; border-radius:50%; background:var(--fairway); color:var(--paper);
    font-size:12px; font-family:'Space Mono',monospace;
  }
  label.field-label{display:block; font-size:12px; font-weight:600; color:#5b5342; margin:10px 0 6px; text-transform:uppercase; letter-spacing:.04em;}

  /* Stepper */
  .stepper{display:flex; align-items:center; gap:12px;}
  .stepper button{
    width:44px; height:44px; border-radius:10px; border:none;
    background:var(--fairway); color:var(--paper); font-size:20px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .stepper button:active{background:var(--fairway-light);}
  .stepper .val{
    font-family:'Space Mono',monospace; font-size:22px; font-weight:700; min-width:34px; text-align:center;
  }

  input[type=text], input[type=number]{
    width:100%; padding:12px 12px; border-radius:10px; border:1px solid var(--line);
    background:#fff; font-family:'Work Sans',sans-serif; font-size:15px; color:var(--ink);
  }
  .players-list{display:flex; flex-direction:column; gap:8px; margin-top:8px;}
  .player-row{display:flex; align-items:center; gap:8px;}
  .player-row .chip{
    width:28px;height:28px;border-radius:50%;background:var(--turf);color:var(--fairway);
    display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;flex:none;
  }

  .toggle-list{display:flex; flex-direction:column; gap:8px; margin-top:6px;}
  .toggle-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px;
  }
  .toggle-item .t-name{font-weight:600; font-size:14px;}
  .toggle-item .t-desc{font-size:11.5px; color:#7a7259; margin-top:2px;}
  .switch{
    width:46px; height:26px; border-radius:20px; background:var(--sand-deep); position:relative; flex:none; border:1px solid var(--line);
  }
  .switch.on{background:var(--turf);}
  .switch .dot{
    position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff;
    transition:left .15s ease; box-shadow:0 1px 2px rgba(0,0,0,.3);
  }
  .switch.on .dot{left:22px;}

  .btn-primary{
    width:100%; padding:15px; border:none; border-radius:12px; background:var(--flag); color:#fff;
    font-family:'Oswald',sans-serif; font-size:16px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
    margin-top:6px;
  }
  .btn-primary:active{background:#a53823;}
  .btn-secondary{
    width:100%; padding:13px; border:1px solid var(--fairway); border-radius:12px; background:transparent; color:var(--fairway);
    font-family:'Oswald',sans-serif; font-size:14px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
    margin-top:8px;
  }

  /* Play screen */
  .hole-nav{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px;}
  .hole-nav button{
    width:42px; height:42px; border-radius:50%; border:none; background:var(--fairway); color:var(--paper); font-size:18px;
  }
  .hole-board{
    flex:1; background:var(--fairway); border-radius:var(--radius); padding:10px 8px; text-align:center; color:var(--paper);
  }
  .hole-board .hnum{font-family:'Oswald',sans-serif; font-size:28px; letter-spacing:.05em;}
  .hole-board .hsub{font-size:10px; color:var(--turf); text-transform:uppercase; letter-spacing:.08em;}

  .par-row{display:flex; gap:8px; align-items:center; margin-top:4px;}
  .par-btn{
    flex:1; padding:10px; border-radius:9px; border:1px solid var(--line); background:#fff; font-weight:700; font-family:'Space Mono',monospace;
  }
  .par-btn.active{background:var(--gold); color:#3a2f00; border-color:var(--gold);}

  .turbo-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    padding:10px; border-radius:9px; border:1.5px dashed var(--flag); background:#fff; color:var(--flag); font-weight:700; font-size:12.5px;
    margin-top:10px;
  }
  .turbo-btn.active{background:var(--flag); color:#fff; border-style:solid;}
  .turbo-row{display:flex; gap:8px;}
  .turbo-row .turbo-btn{flex:1; margin-top:10px;}
  .turbo-btn.solo{border-color:var(--gold); color:#8a6d00;}
  .turbo-btn.solo.active{background:var(--gold); color:#3a2f00; border-style:solid;}
  .turbo-btn.re{border-color:var(--teamC,#7B4FA3); color:#5b3a7a;}
  .turbo-btn.re.active{background:#7B4FA3; color:#fff; border-style:solid;}
  .turbo-btn.re.disabled{opacity:.4; pointer-events:none;}

  .score-card{
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:10px;
  }
  .score-card .card-top{display:flex; align-items:center; gap:6px; margin-bottom:8px;}
  .score-card .pname{font-weight:700; font-size:14px; flex:1; display:flex; align-items:center; gap:6px;}
  .team-badge{
    font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; border:none; color:#fff; flex:none;
  }
  .team-badge.a{background:var(--flag);}
  .team-badge.b{background:#2E6E8E;}
  .team-badge.c{background:#7B4FA3;}
  .team-badge.d{background:#1E8A8A;}
  .team-badge.solo{background:#7a7259;}
  .team-badge.none{background:var(--sand-deep); color:#8a8266;}
  .tag{font-size:11px; font-weight:700; padding:2px 8px; border-radius:8px; display:inline-block;}
  .tag.eagle{background:#DDEEDD; color:#1B6B3A;}
  .tag.birdie{background:#E5F1FF; color:#1B5FA8;}
  .tag.par{background:var(--sand-deep); color:#6b6248;}
  .tag.bogey{background:#F7E4DD; color:var(--flag);}
  .tag.great{background:var(--gold); color:#3a2f00;}

  .colhead{display:flex; gap:6px; margin-bottom:3px;}
  .colhead span{flex:1; font-size:9px; color:#9a9179; text-transform:uppercase; letter-spacing:.05em; text-align:center; font-weight:700;}

  .steprow{display:flex; align-items:stretch; gap:6px;}
  .stepblock{
    flex:1; display:flex; align-items:center; justify-content:space-between; gap:6px;
    background:var(--sand); border:1px solid var(--line); border-radius:10px; padding:5px 6px;
  }
  .stepblock button{
    width:34px; height:34px; border-radius:8px; border:none; font-size:18px; font-weight:700; flex:none;
  }
  .stepblock.strokes button{background:var(--sand-deep); color:var(--fairway);}
  .stepblock.strokes button:active{background:var(--turf);}
  .stepblock.oly button{background:#E4EFE6; color:var(--fairway-light);}
  .stepblock.oly button:active{background:var(--turf);}
  .stepblock .val{font-family:'Space Mono',monospace; font-weight:700; font-size:18px; flex:1; text-align:center;}
  .stepblock.oly .val{color:var(--fairway-light);}

  /* Summary */
  .lead-table{width:100%; border-collapse:collapse; font-size:13px;}
  .lead-table th{
    text-align:left; font-family:'Oswald',sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:.04em;
    color:#7a7259; padding:6px 4px; border-bottom:2px solid var(--line);
  }
  .lead-table td{padding:8px 4px; border-bottom:1px solid var(--line); font-family:'Space Mono',monospace;}
  .lead-table tr:first-child td{font-weight:700;}
  .lead-table td.name{font-family:'Work Sans',sans-serif; font-weight:700;}
  .money.pos{color:#1B6B3A; font-weight:700;}
  .money.neg{color:var(--flag); font-weight:700;}
  .rank-badge{
    width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:cente
